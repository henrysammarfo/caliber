version: "1"
kind: miner
id: 92001
slug: caliber-truthport-text-auth
protocol: generic
name: CALIBER TRUTHPORT Text Authenticity
description: >
  Deterministic text authenticity miner: calibrated P(AI) from surface linguistic
  features. Production calibration uses labeled holdout (RAID primary). Registers
  the HTTP detect surface for Telegraph routing and x402 gating.
base_url: https://caliber-teamtitanlink.vercel.app

auth:
  type: none

rate_limit_per_sec: 5
cache_ttl_sec: 0
circuit_threshold: 5
circuit_cooldown_seconds: 30

endpoints:
  - path: /detect
    external_path: /detect
    method: POST
    description: Score text for AI-likeness (confidence in [0,1], isAI threshold 0.5).

input_schema:
  type: object
  properties:
    text:
      type: string
      maxLength: 50000
    texts:
      type: array
      maxItems: 64
      items:
        type: string
        maxLength: 50000

output_schema:
  type: object
  properties:
    confidence:
      type: number
      minimum: 0
      maximum: 1
    isAI:
      type: boolean
    explanation:
      type: string
    model:
      type: string

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: isAI
    reason_field: explanation
  supported_intents:
    - AI_TEXT_DETECTION
    - CONTENT_VERIFICATION

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    integers:
      - index: 0
        name: confidence_x10000
        description: Model P(AI) in [0,1] scaled by 10000 for on-chain storage.
        source_path: confidence
        multiplier: 10000
    bools:
      - index: 0
        name: is_ai
        description: True when confidence >= 0.5.
        source_path: isAI
        transform_rule: bool_from_eq:true
